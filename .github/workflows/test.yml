name: MIDI Stage checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: midi-stage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install browser test tools
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Build, unit tests and simulated-input browser tests
        shell: bash
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python tests/run.py --browser --storage
          git diff --exit-code -- MIDI-Stage.html
      - name: Collect browser acceptance screenshots
        if: always()
        shell: python
        run: |
          import os, shutil
          from pathlib import Path
          destination = Path(os.environ['RUNNER_TEMP']) / 'midi-stage-acceptance'
          destination.mkdir(exist_ok=True)
          for pattern in ('midi-stage-*.png', 'MIDI-Stage-*.png'):
              for source in Path(os.environ['GITHUB_WORKSPACE']).parent.glob(pattern):
                  shutil.copy2(source, destination / source.name)
      - name: Save browser acceptance screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-acceptance
          path: ${{ runner.temp }}/midi-stage-acceptance
          if-no-files-found: ignore
          retention-days: 7
